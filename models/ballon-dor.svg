<svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="goldBall" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="18%" stop-color="#f3d47a"/>
      <stop offset="45%" stop-color="#d9a441"/>
      <stop offset="72%" stop-color="#a9762a"/>
      <stop offset="100%" stop-color="#6f4a17"/>
    </radialGradient>
    <linearGradient id="panelLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a3a12" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a3a12" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f6f8"/>
      <stop offset="45%" stop-color="#c9ced4"/>
      <stop offset="100%" stop-color="#9aa1a8"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="120" cy="240" rx="70" ry="12" fill="url(#shadow)"/>

  <!-- crumpled foil base -->
  <path d="M55 205 L80 190 L100 208 L120 188 L142 207 L165 189 L188 206
           L178 232 L150 222 L128 236 L108 220 L88 234 L62 224 Z"
        fill="url(#foil)" stroke="#7d848b" stroke-width="1"/>
  <path d="M70 210 L95 200 L118 214 M130 202 L150 213 L172 200"
        stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" fill="none"/>

  <!-- ball -->
  <circle cx="120" cy="115" r="95" fill="url(#goldBall)"/>

  <!-- pentagon panel seams (stylised, not flat outline - follow sphere curvature) -->
  <path d="M120 25 C95 45 80 70 78 95" fill="none" stroke="url(#panelLine)" stroke-width="3"/>
  <path d="M120 25 C145 45 160 70 162 95" fill="none" stroke="url(#panelLine)" stroke-width="3"/>
  <path d="M78 95 C60 108 50 128 52 150" fill="none" stroke="url(#panelLine)" stroke-width="3"/>
  <path d="M162 95 C180 108 190 128 188 150" fill="none" stroke="url(#panelLine)" stroke-width="3"/>
  <path d="M78 95 L120 118 L162 95" fill="none" stroke="url(#panelLine)" stroke-width="3"/>
  <path d="M52 150 C70 165 95 172 120 172 C145 172 170 165 188 150"
        fill="none" stroke="url(#panelLine)" stroke-width="3"/>
  <path d="M120 118 L120 172" fill="none" stroke="url(#panelLine)" stroke-width="3"/>
  <path d="M52 150 L120 172 M188 150 L120 172" fill="none" stroke="url(#panelLine)" stroke-width="2.5"/>

  <!-- engraved text plate -->
  <text x="120" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="13"
        fill="#5a3a12" fill-opacity="0.75" font-weight="bold">BALLON D'OR</text>

  <!-- specular highlight -->
  <ellipse cx="88" cy="65" rx="30" ry="18" fill="#ffffff" fill-opacity="0.35"/>
</svg>
