<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9560f"/>
      <stop offset="18%" stop-color="#ff9a45"/>
      <stop offset="45%" stop-color="#ffb968"/>
      <stop offset="65%" stop-color="#f3841c"/>
      <stop offset="100%" stop-color="#a0450a"/>
    </linearGradient>
    <linearGradient id="blackBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c0c0c"/>
      <stop offset="30%" stop-color="#3a3a3a"/>
      <stop offset="55%" stop-color="#4d4d4d"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="shadow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="100" cy="282" rx="48" ry="10" fill="url(#shadow4)"/>

  <!-- black base cylinder -->
  <rect x="60" y="220" width="80" height="55" rx="8" fill="url(#blackBase)"/>
  <ellipse cx="100" cy="220" rx="40" ry="9" fill="#2b2b2b"/>

  <!-- orange main cylinder -->
  <rect x="60" y="35" width="80" height="190" rx="10" fill="url(#orangeBody)" stroke="#8a3c08" stroke-width="1"/>
  <ellipse cx="100" cy="35" rx="40" ry="10" fill="#ffcf9c" stroke="#8a3c08" stroke-width="1"/>

  <!-- ball emblem circle -->
  <circle cx="100" cy="90" r="30" fill="#fff5ea" fill-opacity="0.15" stroke="#8a3c08" stroke-width="1.5"/>
  <!-- simplified football pentagon pattern -->
  <path d="M100 68 L112 78 L107 93 L93 93 L88 78 Z" fill="#7a3406"/>
  <path d="M100 68 L88 78 L78 70 M100 68 L112 78 L122 70
           M93 93 L82 100 M107 93 L118 100
           M88 78 L78 95 M112 78 L122 95"
        stroke="#7a3406" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- text -->
  <text x="100" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#5c2a05">PLAYER</text>
  <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#5c2a05">OF THE</text>
  <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#5c2a05">MATCH</text>

  <!-- highlight -->
  <rect x="66" y="45" width="10" height="160" rx="5" fill="#ffffff" fill-opacity="0.35"/>
</svg>
